# Local dev stack. Passwords/keys below are throwaway dev defaults, not for
# production use. Bringing every service up under Compose means the Compose
# *service* names (wayfare-auth-service, postgres, ...) are real hostnames
# resolved by Docker's embedded DNS — that's what lets config-repo/*.yml
# point AUTH_SERVICE_URL/DB_HOST/etc at a name instead of localhost.

# OTLP destinations for every Wayfare service. Compose service names resolve on
# the compose network; the config-repo defaults (localhost) cover IDE runs.
x-otel-env: &otel-env
  OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
  OTLP_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs
  OTLP_METRICS_ENDPOINT: http://mimir:9009/otlp/v1/metrics

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wayfare
      POSTGRES_PASSWORD: wayfare
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      # Host-side port only; override when something else already holds 5432
      # on this machine, e.g. `DB_PORT=5433 make up`. Containers always reach
      # postgres on 5432 over the compose network regardless.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # S3-compatible object store for driver documents (private bucket) and
    # profile photos (public-read bucket). Buckets are created by the services
    # at startup (the observability buckets come from minio-init). Console: http://localhost:9001 (wayfare / wayfare-secret).
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wayfare}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wayfare-secret}
    volumes:
      - miniodata:/data
    ports:
      # Host-side only; override if 9000/9001 are taken, e.g.
      # `MINIO_PORT=9100 make up`. The public endpoint below follows it, since
      # presigned URLs are signed for the address the *client* uses.
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    # Read side of the trip service (CQRS): the trips_read collection.
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # KRaft mode — no ZooKeeper. Single broker, single node id, which is why
    # the replication/ISR settings below are all forced to 1: the defaults
    # assume a 3-broker cluster and topic creation hangs without them.
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  schema-registry:
    # Stores the Protobuf schemas of the Kafka events (wayfare-common-events).
    # Listens on 8085, not the image default 8081 (auth-service's port).
    image: confluentinc/cp-schema-registry:8.3.2
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8085}:8085"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      # The 8.x image has no curl; probe with a bare HTTP request over bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8085 && printf 'GET /subjects HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # --- Observability: LGTM (Loki, Grafana, Tempo, Mimir) on MinIO ------------
  # Optional: the services run without it, they just can't export. Services
  # send OTLP straight to each backend (see OTLP_* in x-otel-env).

  minio-init:
    # One-shot: Tempo/Loki/Mimir don't create their own buckets (the services
    # do, in Java), so create them here. The backends wait for this to finish.
    # Reuses the minio image (it ships `mc`) rather than pulling minio/mc.
    image: quay.io/minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment: &minio-creds
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wayfare}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wayfare-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/tempo local/loki local/mimir-blocks local/mimir-ruler local/mimir-alertmanager
    restart: "no"

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment: *minio-creds
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"   # query API
      - "4317:4317"                  # OTLP gRPC
      - "4318:4318"                  # OTLP HTTP
    depends_on:
      minio-init:
        condition: service_completed_successfully

  loki:
    image: grafana/loki:3.3.0
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment: *minio-creds
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    depends_on:
      minio-init:
        condition: service_completed_successfully

  mimir:
    image: grafana/mimir:2.14.0
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true"]
    environment: *minio-creds
    volumes:
      - ./docker/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    ports:
      - "${MIMIR_PORT:-9009}:9009"
    depends_on:
      minio-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Dev only: anonymous admin so there is nothing to log in to.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki, tempo, mimir]

  wayfare-config-server:
    build:
      context: .
      dockerfile: wayfare-config-server/Dockerfile
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  wayfare-server-discovery:
    build:
      context: .
      dockerfile: wayfare-server-discovery/Dockerfile
    environment:
      CONFIG_SERVER_URL: http://wayfare-config-server:8888
    ports:
      - "8761:8761"
    depends_on:
      wayfare-config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  wayfare-auth-service:
    build:
      context: .
      dockerfile: wayfare-auth-service/Dockerfile
    environment:
      <<: *otel-env
      CONFIG_SERVER_URL: http://wayfare-config-server:8888
      EUREKA_URL: http://wayfare-server-discovery:8761/eureka/
      DB_HOST: postgres
      DB_USERNAME: wayfare
      DB_PASSWORD: wayfare
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8085
      # Optional: creates the single ADMIN account at start-up (needed to
      # approve drivers). Unset = no admin. Password min 8 characters.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./keys:/etc/wayfare/jwt:ro
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      wayfare-config-server:
        condition: service_healthy
      wayfare-server-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  wayfare-rider-service:
    build:
      context: .
      dockerfile: wayfare-rider-service/Dockerfile
    environment:
      <<: *otel-env
      CONFIG_SERVER_URL: http://wayfare-config-server:8888
      EUREKA_URL: http://wayfare-server-discovery:8761/eureka/
      DB_HOST: postgres
      DB_USERNAME: wayfare
      DB_PASSWORD: wayfare
      AUTH_SERVICE_URL: http://wayfare-auth-service:8081
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8085
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-wayfare}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-wayfare-secret}
    ports:
      - "8082:8082"
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      wayfare-config-server:
        condition: service_healthy
      wayfare-server-discovery:
        condition: service_healthy
      wayfare-auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  wayfare-driver-service:
    build:
      context: .
      dockerfile: wayfare-driver-service/Dockerfile
    environment:
      <<: *otel-env
      CONFIG_SERVER_URL: http://wayfare-config-server:8888
      EUREKA_URL: http://wayfare-server-discovery:8761/eureka/
      DB_HOST: postgres
      DB_USERNAME: wayfare
      DB_PASSWORD: wayfare
      AUTH_SERVICE_URL: http://wayfare-auth-service:8081
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8085
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-wayfare}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-wayfare-secret}
    ports:
      - "8083:8083"
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      wayfare-config-server:
        condition: service_healthy
      wayfare-server-discovery:
        condition: service_healthy
      wayfare-auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  wayfare-api-gateway:
    build:
      context: .
      dockerfile: wayfare-api-gateway/Dockerfile
    environment:
      <<: *otel-env
      CONFIG_SERVER_URL: http://wayfare-config-server:8888
      EUREKA_URL: http://wayfare-server-discovery:8761/eureka/
      AUTH_SERVICE_URL: http://wayfare-auth-service:8081
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      wayfare-config-server:
        condition: service_healthy
      wayfare-server-discovery:
        condition: service_healthy
      wayfare-auth-service:
        condition: service_healthy

  wayfare-trip-service:
    build:
      context: .
      dockerfile: wayfare-trip-service/Dockerfile
    environment:
      <<: *otel-env
      CONFIG_SERVER_URL: http://wayfare-config-server:8888
      EUREKA_URL: http://wayfare-server-discovery:8761/eureka/
      DB_HOST: postgres
      DB_USERNAME: wayfare
      DB_PASSWORD: wayfare
      MONGO_URI: mongodb://mongo:27017/wayfare_trip
      AUTH_SERVICE_URL: http://wayfare-auth-service:8081
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8085
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      wayfare-config-server:
        condition: service_healthy
      wayfare-server-discovery:
        condition: service_healthy
      wayfare-auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  wayfare-matching-service:
    build:
      context: .
      dockerfile: wayfare-matching-service/Dockerfile
    environment:
      <<: *otel-env
      CONFIG_SERVER_URL: http://wayfare-config-server:8888
      EUREKA_URL: http://wayfare-server-discovery:8761/eureka/
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8085
      DRIVER_GRPC_ADDRESS: static://wayfare-driver-service:9083
      # dev = seed SEED_DRIVER_IDS (approved driver UUIDs, comma-separated) into
      # the geo set at start-up. Set MATCHING_PROFILES= to turn it off.
      SPRING_PROFILES_ACTIVE: ${MATCHING_PROFILES-dev}
      SEED_DRIVER_IDS: ${SEED_DRIVER_IDS:-}
    ports:
      - "8086:8086"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      wayfare-config-server:
        condition: service_healthy
      wayfare-server-discovery:
        condition: service_healthy
      wayfare-driver-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  miniodata:
  tempo-data:
  loki-data:
  mimir-data:
  grafana-data:
