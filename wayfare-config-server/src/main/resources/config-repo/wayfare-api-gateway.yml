server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri (not issuer-uri) — wayfare-auth-service exposes a JWKS
          # endpoint directly but doesn't implement OIDC discovery metadata
          # (no /.well-known/openid-configuration), which issuer-uri requires.
          jwk-set-uri: http://wayfare-auth-service/auth/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          # Enable Eureka-based load balancing for services without an explicit route below
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true # use lowercase service names in URLs
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: auth-service
              uri: lb://wayfare-auth-service
              predicates:
                - Path=/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
