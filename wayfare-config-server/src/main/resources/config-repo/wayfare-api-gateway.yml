server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri (not issuer-uri) — wayfare-auth-service exposes a JWKS
          # endpoint directly but doesn't implement OIDC discovery metadata
          # (no /.well-known/openid-configuration), which issuer-uri requires.
          # Needs a literal, resolvable URL, not the Eureka logical name under
          # lb:// — the auto-configured ReactiveJwtDecoder uses a plain
          # (non-load-balanced) WebClient. AUTH_SERVICE_URL supplies that
          # literal URL per environment: under Docker Compose it's the
          # compose service name (resolved by Docker's embedded DNS, nothing
          # to do with Eureka/lb://); on bare host it defaults to localhost.
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/auth/.well-known/jwks.json
  cloud:
    gateway:
      server:
        webflux:
          # Enable Eureka-based load balancing for services without an explicit route below
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true # use lowercase service names in URLs
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: auth-service
              uri: lb://wayfare-auth-service
              predicates:
                - Path=/auth/**
            - id: rider-service
              uri: lb://wayfare-rider-service
              predicates:
                - Path=/riders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
