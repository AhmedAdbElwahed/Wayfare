# Rider service configuration

server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/wayfare_rider
    username: ${DB_USERNAME:wayfare}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Same reasoning as the gateway — see wayfare-api-gateway.yml — plus
          # one more wrinkle: even under Docker Compose, don't wrap the
          # Eureka logical name in an lb:// scheme here — this property wants
          # a literal URL, not a Spring Cloud LB URI. AUTH_SERVICE_URL points
          # straight at the Compose *service* name instead, which Docker's
          # embedded DNS resolves like any other host — a mechanism that has
          # nothing to do with Eureka/lb://.
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8081}/auth/.well-known/jwks.json

  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
      bindings:
        # Binding name must match the @Bean method name in
        # AccountEventsConsumer — that's how the function gets bound.
        onAccountRegistered-in-0:
          destination: account.events
          # A consumer group means one delivery per group, not per instance:
          # scale rider-service to N replicas and a registration still creates
          # exactly one profile. Without it every replica would consume every
          # message.
          group: rider-service
          consumer:
            max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      # Splits the aggregate health into /actuator/health/liveness (is the
      # process alive) and /actuator/health/readiness (can it serve traffic).
      # Readiness includes the datasource check, so an instance that can't
      # reach PostgreSQL stops being routed to instead of returning 500s.
      probes:
        enabled: true

wayfare:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    # Address clients use; presigned URLs are signed for this host.
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:wayfare}
    secret-key: ${STORAGE_SECRET_KEY:wayfare-secret}
