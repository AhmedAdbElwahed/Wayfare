# Mimir, monolithic mode, blocks/ruler/alertmanager data stored in MinIO.
# Single tenant, so no X-Scope-OrgID header is needed.
target: all
multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095

common:
  storage:
    backend: s3
    s3:
      endpoint: minio:9000
      access_key_id: wayfare
      secret_access_key: wayfare-secret
      insecure: true

blocks_storage:
  storage_prefix: blocks
  s3:
    bucket_name: mimir-blocks
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/tsdb-sync

ruler_storage:
  s3:
    bucket_name: mimir-ruler

alertmanager_storage:
  s3:
    bucket_name: mimir-alertmanager

ingester:
  ring:
    instance_addr: 127.0.0.1
    replication_factor: 1
    kvstore:
      store: inmemory

store_gateway:
  sharding_ring:
    replication_factor: 1

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: inmemory

ruler:
  rule_path: /data/ruler

limits:
  # Tempo's span-metrics and the services' OTLP metrics are the only inputs.
  compactor_blocks_retention_period: 7d
