# Loki, single-binary mode, chunks and index stored in MinIO (bucket `loki`).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: minio:9000
      bucketnames: loki
      access_key_id: ${MINIO_ROOT_USER:wayfare}
      secret_access_key: ${MINIO_ROOT_PASSWORD:wayfare-secret}
      s3forcepathstyle: true
      insecure: true

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for native OTLP ingestion: trace_id, span_id and severity are
  # stored as structured metadata, not labels (keeps label cardinality low).
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3
